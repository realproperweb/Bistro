<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0e0e10" />
<title>Buy me a coffee ☕</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <!-- inline SVG coffee cup icon -->
        <svg viewBox="0 0 64 64" width="72" height="72">
          <path d="M12 20h32v16a14 14 0 0 1-14 14h-4A14 14 0 0 1 12 36V20z"
                fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <path d="M44 24h6a6 6 0 0 1 0 12h-6" fill="none" stroke="currentColor" stroke-width="3"/>
          <path d="M20 8c0 3-2 3-2 6M28 8c0 3-2 3-2 6M36 8c0 3-2 3-2 6"
                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>Buy me a coffee</h1>
      <p class="sub">Pick a brew — pay with crypto in seconds.</p>
    </header>

    <section class="grid" id="options" aria-label="Coffee options"></section>

    <footer class="foot">
      <span>Powered by</span>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>NOWPayments</span>
    </footer>
  </main>

  <!-- Modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <button class="modal__x" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div id="mIcon" class="modal__icon"></div>
      <h2 id="mTitle">Confirm</h2>
      <p id="mDesc" class="modal__desc"></p>
      <div class="modal__row">
        <span>Amount</span><strong id="mAmount">$0.00</strong>
      </div>
      <button id="mPay" class="btn btn--primary">Pay with crypto</button>
      <p class="modal__fine">You'll be redirected to a secure NOWPayments invoice.</p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
