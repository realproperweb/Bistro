<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Me a Coffee ☕</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>☕ Buy Me a Coffee</h1>
    <p class="subtitle">Fuel my code with caffeine — pay with crypto!</p>
  </header>

  <section class="drinks" id="drinksGrid">
    <!-- Drink cards injected by JS -->
  </section>

  <!-- Custom amount section -->
  <section class="custom-section hidden" id="customSection">
    <h2>Choose Your Amount</h2>
    <div class="custom-input-wrap">
      <span class="currency">$</span>
      <input type="number" id="customAmount" min="1" step="1" placeholder="10" value="10">
      <span class="usd-label">USD</span>
    </div>
    <div class="quick-amounts">
      <button data-amt="5">$5</button>
      <button data-amt="10">$10</button>
      <button data-amt="25">$25</button>
      <button data-amt="50">$50</button>
      <button data-amt="100">$100</button>
    </div>
    <button class="btn-primary" id="customCheckoutBtn">Continue →</button>
  </section>

  <!-- Payment currency selection -->
  <div class="modal hidden" id="currencyModal">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">✕</button>
      <h2>Pay with…</h2>
      <p id="selectedDrinkLabel" class="selected-label"></p>
      <div class="currency-grid" id="currencyGrid">
        <button data-currency="usdttrc20">💵 USDT (TRC20)</button>
        <button data-currency="usdterc20">💵 USDT (ERC20)</button>
        <button data-currency="btc">₿ Bitcoin</button>
        <button data-currency="eth">Ξ Ethereum</button>
        <button data-currency="ltc">Ł Litecoin</button>
        <button data-currency="bnbbsc">BNB (BSC)</button>
        <button data-currency="trx">TRON</button>
        <button data-currency="doge">Ð Dogecoin</button>
      </div>
    </div>
  </div>

  <!-- Payment details -->
  <div class="modal hidden" id="paymentModal">
    <div class="modal-content">
      <button class="close-btn" id="closePayment">✕</button>
      <h2>Complete Payment</h2>
      <div class="payment-info">
        <div class="row"><span>Order:</span><strong id="pOrder"></strong></div>
        <div class="row"><span>Amount:</span><strong id="pAmount"></strong></div>
        <div class="row"><span>Status:</span><strong id="pStatus">waiting</strong></div>
      </div>
      <div class="pay-address">
        <label>Send to:</label>
        <div class="addr-box">
          <code id="pAddress"></code>
          <button class="copy-btn" id="copyAddr">Copy</button>
        </div>
      </div>
      <p class="note">⚠️ Send the exact amount. Payment expires in ~20 min.</p>
      <div class="status-poller" id="poller">⏳ Waiting for confirmation…</div>
    </div>
  </div>

  <footer>
    <p>Powered by <a href="https://nowpayments.io" target="_blank">NOWPayments</a> · Crypto accepted 🌍</p>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
